# ================================
# SERVER CONFIG
# ================================
server.port=8080

# ================================
# POSTGRESQL DATABASE CONFIG
# Change username/password to match your local PostgreSQL setup
# Make sure a database named "skillbridge_db" exists (PostgreSQL does NOT
# auto-create databases like MySQL did - see README for the one-time command)
# ================================
spring.datasource.url=jdbc:postgresql://localhost:5432/skillbridge_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================
# JPA / HIBERNATE CONFIG
# "update" will auto-create/alter tables based on our Entity classes
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ================================
# JACKSON (avoid infinite loop when converting Entities with relationships to JSON)
# ================================
spring.jackson.serialization.fail-on-empty-beans=false
